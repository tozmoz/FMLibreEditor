# FM27 Launch Preview on Steam for macOS (app 4530370, build 26227640): the Intel half of the
# universal game_plugin, which Intel Macs run, and Apple silicon Macs under Rosetta. The arrays
# sit as close together as on Windows: staff 0x48 and clubs 0x1B8 after the players.
name = "FM27 Steam build 26227640 (Launch Preview, macOS, Intel)"
edition = 27
storefront = "steam"

# The in-game date: the variable among the globals where the arm64 half has its own, which read
# 14 July 2026 on the test save, as the date did.
current_date = 0x5C69700

# game_plugin as mapped in memory: its LC_UUID identifies the build and the architecture.
[plugin]
uuid = "22CFE5C3-B5CF-3C00-8043-1EA190A69B89"

# RVAs in game_plugin of the (begin, end) pointer pairs of the entity arrays.
[arrays]
players = 0x5C891C8
staff = 0x5C89210
clubs = 0x5C89380
