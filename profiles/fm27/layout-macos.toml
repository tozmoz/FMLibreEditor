# A nation's national teams (#169, docs/recon/fm27-national-teams.md), read on the Mac (Steam build 26385295, Apple
# silicon, a save of 14 September 2026). Each nation has two containers (`db::NATIONAL_TEAM_CONTAINER`), one for its
# men's teams and one for its women's: 251 of each, 502 in all. A container holds its teams as (begin, end, capacity)
# of pointers, the senior team first; they are laid out as a club's team ([team]), with the container where a club's
# team points at its club. The nation (`db::NATION`, [nation]) points at its two containers.
[national]
container_uid = 0x0C          # Italia's men's: 776, the nation's UID; the women's have a UID of their own
container_teams = 0x18        # Italia's men's: 23 players in the senior team, a manager, a reputation of 8500
container_women = 0xB9        # u8: 0 at all 251 men's containers, 1 at all 251 women's
container_nation = 0x170      # pointer back to its nation, at all 502
nation_code = 0x28            # an FM string: "ITA"
nation_men = 0x110
nation_women = 0x118
# A nation's youth rating and settings, as the pre-game editor shows them (see layout.toml): in the container and in
# the nation 8 bytes later than on Windows, and in the attendance record where Windows has them. Read on Steam build
# 26797085 (Apple silicon, a save of 18 July 2027): the youth ratings of England 135, France 155, Poland 94 and San
# Marino 29 (their women's 161, 160, 103, 4), and the settings of England, Poland and San Marino, men's and women's,
# hold what the Windows save of July 2026 does. A year on, the game has moved some second copies a point away from the
# first (France's youth rating 155 and 156, its women's 160 and 161); the editor writes both.
youth_rating = 0x872          # u16, after the federation's founding year
youth_rating_copy = 0x874     # u16
game_importance = 0x884       # u8, 1 to 4
game_importance_copy = 0x885  # u8
fa_financial_power = 0x88A    # u8, 0 to 20
fa_financial_power_copy = 0x88B  # u8
fa_patience = 0x88D           # u8, 0 to 20
container_record = 0xB0       # pointer to the record, as on Windows
attendance = 0x68             # in the record: u32
min_attendance = 0x6C         # in the record: u32
max_attendance = 0x70         # in the record: u32
economic_factor = 0x1F8       # in the nation: u8, 0 to 20
state_of_development = 0x1F4  # in the nation: u8, 1 to 3

# What a national team's profile shows of its nation and federation (#210, docs/recon/fm27-national-teams.md), read on
# Steam build 26620374 (Apple silicon, a save of 28 September 2026) and checked against the game's nation page and
# its staff list: the founding year and continent of Italia, the continent of Brasile and Inghilterra, and the job in
# the national team and the team of each of the 24 members of staff of Italia's men's teams.
[national.details]
founded = 0x870               # u16 in the container: Italia 1898, the same in both of a nation's; 0 where none
medical_staff = 0x60          # in the container, where a club keeps its departments: Italia's men's, 2 physios
coaching_staff = 0x78         # 16, of its senior, under-21 and under-20 teams; their 4 managers are not in any
scouting_staff = 0x90         # 2
continent = 0xF8              # pointer in the nation to its db::CONTINENT
continent_name = 0x18         # an FM string there: "Europa", in the game's language
# In a staff object, right after his contract: the record of his other contracts, whose slot 0x10 points at his
# contract with one of a federation's teams (db::BASIC_CONTRACT, a manager's db::FULL_CONTRACT), the team at its
# +0x10 and his job there at its +0x26: Walter Martinelli, with no club, a physio (12) of Italia's senior team.
staff_contracts = 0x178
national_contract = 0x10

# The game's transfers, and a move agreed for a later day, laid out as on Windows (see layout.toml and
# crates/fmlibre-core/src/arranged.rs) but for the player's records, which sit in the person, 0x40 earlier as his other
# fields there, and the records themselves, which take 24 bytes. Read on Steam build 26620374, Apple silicon, on the
# Arsenal save of 16 July 2027: one TRANSFER_MANAGER, its 8,411 offers (FULL_TRANSFER_OFFER, 0xD0 bytes) and its 29
# moves due, each the player's person block, the day and the offer's number, as each of the 29 players' entries and
# offers say. Gonzalo Tapia's due on 17 July: offer 1,873 agreed (19), his entry of it waiting (2) with the contract he
# is to have, and his records at +0x2E0 (1,873) and +0x2E8 (the entry). Of 40,369 players, 4,598 have both records,
# mostly 24 bytes apart in the game's blocks of 24, and 2,716 only one. The offer's kind (+0x86): every entry of a
