# A loan agreed for a later day, laid out as on Windows (see layout.toml). Read on Steam build 26797085, Apple silicon,
# on the Arsenal save of 18 July 2027: 406 LOAN_OFFERs, 0x128 bytes apart in a pool of their own, and 317 loan
# contracts, 0x100 apart in theirs. Of the 165 loans the game had made, 140 players are still on them, and each one's
# loan contract holds what his offer holds where the Windows layout places it: the wage, the monthly fee (twice), how
# long it runs, the future fee and its kind (0xFF none in 109, 0xFE an option in 15, mandatory 0x64, 0x14 or 0x19 in
# 16), and +0x114 as the contract's +0xC8. Where an offer's two wages differ (3 loans), +0x108 is the contract's wage
