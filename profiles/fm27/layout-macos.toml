# The rules a competition's squads are registered under (see layout.toml, crates/fmlibre-core/src/rules.rs and
# docs/recon/fm27-league-rules.md), read on the Mac (Steam build 26620374, Apple silicon, the Arsenal save of 18 July
# 2027). A competition as it is played starts with a lock, pthread's ('MUTX'), which takes 0x18 bytes more than the
# Windows one, so the fields after it sit 0x18 further on; a rule group's pointer to its nation's rules sits 0x10
# further on, and the records in a nation's container 8. The sets of fixture rules, their lists and the rules are laid
