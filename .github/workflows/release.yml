# Builds the Windows installer, the portable zip and the macOS app.
# - A version tag (v0.1.0) runs the checks, builds, and opens a draft GitHub release with the
#   three files; a maintainer reviews the draft and publishes it.
# - A pull request that changes how releases are built, or a run started by hand, builds the
#   same files and keeps them as workflow artifacts only.
# Pull requests are otherwise checked locally before they are opened, which spares the Windows
# and macOS minutes a private repository pays for (a macOS minute counts as ten).
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "app/src-tauri/tauri.conf.json"
      - "app/src-tauri/tauri.bridge.conf.json"
      - "docs/portable-readme.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check that the tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "The tag ${{ github.ref_name }} does not match the app's version $version (app/src-tauri/tauri.conf.json)."
          }

      - name: Install the interface's packages
        working-directory: app
        run: npm ci

      # The Rust side embeds the built interface, so it is built first.
      - name: Build the interface
        working-directory: app
        run: npm run build

      - name: Checks
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Build the installer
        working-directory: app
        run: npx tauri build --bundles nsis

      - name: Package the installer and the portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $setup.FullName out/FMLibreEditor-Setup.exe
          New-Item -ItemType Directory -Force portable/FMLibreEditor | Out-Null
          Copy-Item target/release/FMLibreEditor.exe portable/FMLibreEditor/
          Copy-Item docs/portable-readme.txt portable/FMLibreEditor/README.txt
          Compress-Archive -Path portable/FMLibreEditor -DestinationPath out/FMLibreEditor-portable.zip
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: FMLibreEditor-windows
          path: out/*

  macos:
    runs-on: macos-latest
    env:
      # With the maintainer's Apple Developer ID in the repository's secrets, the app is signed and notarized, and
      # opens without a warning:
      # - APPLE_CERTIFICATE: the "Developer ID Application" certificate with its key, a .p12 file, in base64;
      # - APPLE_CERTIFICATE_PASSWORD: the password the .p12 was exported with;
      # - APPLE_ID, APPLE_APP_PASSWORD and APPLE_TEAM_ID: the Apple ID, an app-specific password made for it at
      #   account.apple.com, and the team ID, for Apple's notary service.
      # Without them the app is signed ad hoc, and macOS asks once before it opens it.
      SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Both architectures: the app and the bridge are universal, so that Intel builds of the
      # game load the bridge too.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Check that the tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "The tag $TAG does not match the app's version $version (app/src-tauri/tauri.conf.json)." >&2
            exit 1
          fi

      - name: Install the interface's packages
        working-directory: app
        run: npm ci

      - name: Build the interface
        working-directory: app
        run: npm run build

      # The macOS side of the code; the formatting is checked on Windows.
      - name: Checks
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      # The certificate goes into a keychain of its own, which only this job uses.
      - name: Import the Developer ID certificate
        if: env.SIGNED == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          if [ -z "$identity" ]; then
            echo "APPLE_CERTIFICATE holds no Developer ID Application identity." >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      # FMLibreEditor.app, universal, with the bridge and its launcher among its resources. With the
      # Developer ID, all three are signed with it and the hardened runtime; without it, ad hoc
      # (`npm run release:mac` does the same on a Mac of one's own).
      - name: Build the app
        working-directory: app
        run: |
          npm run bridge
          config=src-tauri/tauri.bridge.conf.json
          if [ "$SIGNED" = true ]; then
            for binary in ../target/universal-apple-darwin/release/libfmlibre_bridge.dylib \
              ../target/universal-apple-darwin/release/fmlibre-launch; do
              codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$binary"
            done
            node -e '
              const fs = require("fs");
              const config = JSON.parse(fs.readFileSync("src-tauri/tauri.bridge.conf.json", "utf8"));
              config.bundle.macOS.signingIdentity = process.env.APPLE_SIGNING_IDENTITY;
              fs.writeFileSync("src-tauri/tauri.signed.conf.json", JSON.stringify(config, null, 2));
            '
            config=src-tauri/tauri.signed.conf.json
          fi
          npx tauri build --target universal-apple-darwin --bundles app --config "$config"

      # Apple's notary service scans the signed app (no review by anyone), usually in minutes; its
      # ticket is stapled to the app, so that it opens without a warning even offline.
      - name: Notarize the app
        if: env.SIGNED == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          app=target/universal-apple-darwin/release/bundle/macos/FMLibreEditor.app
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait \
            --output-format json > "$RUNNER_TEMP/notary.json"
          cat "$RUNNER_TEMP/notary.json"
          status=$(node -p "require('$RUNNER_TEMP/notary.json').status")
          if [ "$status" != "Accepted" ]; then
            id=$(node -p "require('$RUNNER_TEMP/notary.json').id")
            xcrun notarytool log "$id" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID"
            exit 1
          fi
          xcrun stapler staple "$app"
          spctl --assess --type execute --verbose=2 "$app"

      - name: Package the app
        run: |
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent \
            target/universal-apple-darwin/release/bundle/macos/FMLibreEditor.app out/FMLibreEditor-macOS.zip
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: FMLibreEditor-macos
          path: out/*

  # Once both systems have built their files.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          out/FMLibreEditor-Setup.exe out/FMLibreEditor-portable.zip out/FMLibreEditor-macOS.zip
          --draft --title "FMLibreEditor ${{ github.ref_name }}"
          --notes-file docs/release-notes.md
