[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
authors = ["FMLibreEditor contributors"]

[workspace.dependencies]
fmlibre-mem = { path = "crates/fmlibre-mem" }
fmlibre-core = { path = "crates/fmlibre-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Size-oriented release settings recommended by Tauri: https://tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
